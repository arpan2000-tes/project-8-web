<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Kasir POS - Project 8</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans h-screen flex flex-col">

  <!-- Header / Navbar -->
  <header class="bg-indigo-600 text-white px-6 py-4 flex justify-between items-center shadow-md">
    <div class="flex items-center space-x-3">
      <h1 class="text-xl font-bold tracking-wide">🛒 Kasir POS App</h1>
      <span class="bg-indigo-700 text-xs px-2 py-1 rounded-full text-indigo-200">v1.0 Monorepo</span>
    </div>
    <div class="flex items-center space-x-4">
      <div class="text-right">
        <p class="text-sm font-semibold" id="user-display">Kasir: Demo User</p>
        <p class="text-xs text-indigo-200">Shift Pagi</p>
      </div>
      <button onclick="alert('Fungsi Logout nanti terhubung ke FastAPI')" class="bg-indigo-800 hover:bg-indigo-900 text-xs px-3 py-2 rounded-lg transition">
        Logout
      </button>
    </div>
  </header>

  <!-- Main Content Layout (Grid 2 Kolom) -->
  <div class="flex-1 flex overflow-hidden">
    
    <!-- Kolom Kiri: Katalog Produk (2/3 layar) -->
    <main class="w-2/3 p-6 overflow-y-auto flex flex-col">
      <!-- Search & Filter Bar -->
      <div class="flex justify-between items-center mb-6 gap-4">
        <input 
          type="text" 
          id="search-input"
          placeholder="Cari nama barang atau kode SKU..." 
          class="w-full px-4 py-2 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white shadow-sm"
          onkeyup="filterProducts()"
        >
        <select class="px-4 py-2 rounded-xl border border-gray-300 bg-white shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <option value="all">Semua Kategori</option>
          <option value="makanan">Makanan</option>
          <option value="minuman">Minuman</option>
        </select>
      </div>

      <!-- Grid Produk -->
      <div id="product-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
        <!-- Card Produk akan dirender otomatis via JavaScript -->
      </div>
    </main>

    <!-- Kolom Kanan: Rincian Keranjang & Pembayaran (1/3 layar) -->
    <aside class="w-1/3 bg-white border-l border-gray-200 flex flex-col shadow-lg">
      <div class="p-4 border-b border-gray-200 bg-gray-50">
        <h2 class="text-lg font-bold text-gray-800">Pesanan Saat Ini</h2>
        <p class="text-xs text-gray-500">No. Transaksi: <span class="font-mono text-indigo-600">#TRX-8821</span></p>
      </div>

      <!-- List Item Keranjang -->
      <div id="cart-list" class="flex-1 overflow-y-auto p-4 divide-y divide-gray-100">
        <p id="empty-cart-msg" class="text-center text-gray-400 my-10 text-sm">Keranjang masih kosong</p>
      </div>

      <!-- Ringkasan Total & Tombol Bayar -->
      <div class="p-4 border-t border-gray-200 bg-gray-50 space-y-3">
        <div class="flex justify-between text-sm text-gray-600">
          <span>Subtotal</span>
          <span id="subtotal-text" class="font-semibold">Rp 0</span>
        </div>
        <div class="flex justify-between text-sm text-gray-600">
          <span>Pajak (11%)</span>
          <span id="tax-text" class="font-semibold">Rp 0</span>
        </div>
        <div class="flex justify-between text-lg font-bold text-gray-900 pt-2 border-t border-gray-200">
          <span>Total</span>
          <span id="total-text" class="text-indigo-600">Rp 0</span>
        </div>

        <button 
          onclick="processCheckout()" 
          class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow-lg transition duration-200 flex justify-center items-center space-x-2"
        >
          <span>Proses Pembayaran</span>
        </button>
      </div>
    </aside>

  </div>

  <!-- JavaScript Logika UI & Dummy Data -->
  <script>
    // Dummy Data Produk (Nanti diganti dengan fetch API dari backend FastAPI)
    const products = [
      { id: 1, name: "Kopi Hitam", category: "minuman", price: 12000, icon: "☕" },
      { id: 2, name: "Es Teh Manis", category: "minuman", price: 5000, icon: "🥤" },
      { id: 3, name: "Nasi Goreng", category: "makanan", price: 20000, icon: "🍳" },
      { id: 4, name: "Mie Goreng", category: "makanan", price: 18000, icon: "🍜" },
      { id: 5, name: "Roti Bakar", category: "makanan", price: 15000, icon: "🍞" },
      { id: 6, name: "Air Mineral", category: "minuman", price: 4000, icon: "💧" }
    ];

    let cart = [];

    // Render Grid Produk
    function renderProducts(items) {
      const grid = document.getElementById("product-grid");
      grid.innerHTML = "";
      
      items.forEach(product => {
        grid.innerHTML += `
          <div 
            onclick="addToCart(${product.id})" 
            class="bg-white p-4 rounded-xl border border-gray-200 hover:border-indigo-500 hover:shadow-md cursor-pointer transition flex flex-col justify-between"
          >
            <div class="text-3xl mb-2 text-center">${product.icon}</div>
            <div>
              <h3 class="font-bold text-gray-800 text-sm">${product.name}</h3>
              <p class="text-xs text-gray-400 capitalize">${product.category}</p>
            </div>
            <p class="text-indigo-600 font-bold text-sm mt-2">Rp ${product.price.toLocaleString("id-ID")}</p>
          </div>
        `;
      });
    }

    // Tambah Produk ke Keranjang
    function addToCart(productId) {
      const product = products.find(p => p.id === productId);
      const existingItem = cart.find(item => item.id === productId);

      if (existingItem) {
        existingItem.qty += 1;
      } else {
        cart.push({ ...product, qty: 1 });
      }

      updateCartUI();
    }

    // Ubah Jumlah (Qty)
    function changeQty(productId, delta) {
      const item = cart.find(i => i.id === productId);
      if (!item) return;

      item.qty += delta;
      if (item.qty <= 0) {
        cart = cart.filter(i => i.id !== productId);
      }

      updateCartUI();
    }

    // Update Tampilan Keranjang & Kalkulasi Total
    function updateCartUI() {
      const cartList = document.getElementById("cart-list");
      const emptyMsg = document.getElementById("empty-cart-msg");

      if (cart.length === 0) {
        cartList.innerHTML = `<p id="empty-cart-msg" class="text-center text-gray-400 my-10 text-sm">Keranjang masih kosong</p>`;
        document.getElementById("subtotal-text").innerText = "Rp 0";
        document.getElementById("tax-text").innerText = "Rp 0";
        document.getElementById("total-text").innerText = "Rp 0";
        return;
      }

      cartList.innerHTML = "";
      let subtotal = 0;

      cart.forEach(item => {
        const itemTotal = item.price * item.qty;
        subtotal += itemTotal;

        cartList.innerHTML += `
          <div class="py-3 flex justify-between items-center">
            <div>
              <h4 class="font-semibold text-sm text-gray-800">${item.name}</h4>
              <p class="text-xs text-gray-500">Rp ${item.price.toLocaleString("id-ID")} x ${item.qty}</p>
            </div>
            <div class="flex items-center space-x-2">
              <button onclick="changeQty(${item.id}, -1)" class="w-6 h-6 bg-gray-200 hover:bg-gray-300 rounded text-xs font-bold">-</button>
              <span class="text-sm font-semibold w-4 text-center">${item.qty}</span>
              <button onclick="changeQty(${item.id}, 1)" class="w-6 h-6 bg-gray-200 hover:bg-gray-300 rounded text-xs font-bold">+</button>
            </div>
          </div>
        `;
      });

      const tax = subtotal * 0.11;
      const total = subtotal + tax;

      document.getElementById("subtotal-text").innerText = `Rp ${subtotal.toLocaleString("id-ID")}`;
      document.getElementById("tax-text").innerText = `Rp ${Math.round(tax).toLocaleString("id-ID")}`;
      document.getElementById("total-text").innerText = `Rp ${Math.round(total).toLocaleString("id-ID")}`;
    }

    // Filter Pencarian
    function filterProducts() {
      const query = document.getElementById("search-input").value.toLowerCase();
      const filtered = products.filter(p => p.name.toLowerCase().includes(query));
      renderProducts(filtered);
    }

    // Simulasi Checkout (Area Integrasi Backend FastAPI)
    function processCheckout() {
      if (cart.length === 0) {
        alert("Pilih minimal satu produk sebelum memproses pembayaran!");
        return;
      }

      // Nanti di area ini Anda bisa mengirim data `cart` menggunakan fetch()
      /*
      fetch('http://localhost:8000/api/v1/transactions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + localStorage.getItem('token')
        },
        body: JSON.stringify({ items: cart })
      })
      */

      alert(`Transaksi Berhasil! Total Pembayaran: ${document.getElementById("total-text").innerText}`);
      cart = [];
      updateCartUI();
    }

    // Jalankan render awal
    renderProducts(products);
  </script>
</body>
</html>
